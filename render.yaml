# Render Blueprint for Qrder (pnpm + Turborepo monorepo)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys: api (Express) + customer/admin/kitchen/pos (Next.js) + Postgres + Redis.
# All on the FREE tier (services spin down when idle; free Postgres expires ~30 days).
#
# NOTE on URLs: the *.onrender.com hostnames below assume the service names are
# available globally. If Render appends a suffix to any service, update the
# matching NEXT_PUBLIC_* / ALLOWED_ORIGINS / CUSTOMER_APP_URL values and redeploy
# (NEXT_PUBLIC_* vars are baked at build time, so the frontends must be rebuilt).

databases:
  - name: qrder-db
    plan: free
    databaseName: qrder
    user: qrder

services:
  # ---------------------------------------------------------------- Redis
  - type: keyvalue
    name: qrder-redis
    plan: free
    ipAllowList: [] # internal-only access

  # ------------------------------------------------------------------ API
  - type: web
    name: qrder-api
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /health
    # db:push syncs the Drizzle schema to Postgres at build time (no migration
    # files are committed, and Free-tier services have no shell to run it manually).
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@qrder/api && pnpm --filter @qrder/db exec drizzle-kit push --force
    # Run via tsx (like dev): the compiled dist uses extensionless ESM imports
    # which Node's native loader rejects. tsx resolves them. Avoids rewriting
    # every import with .js across the codebase.
    startCommand: pnpm --filter @qrder/api exec tsx src/index.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qrder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: qrder-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # 32+ char secure value
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ALLOWED_ORIGINS
        value: https://qrder-customer.onrender.com,https://qrder-admin.onrender.com,https://qrder-kitchen.onrender.com,https://qrder-pos.onrender.com
      - key: CUSTOMER_APP_URL
        value: https://qrder-customer.onrender.com
      # --- Secrets you must paste in the dashboard (sync:false keeps them out of git) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ------------------------------------------------------------- customer
  - type: web
    name: qrder-customer
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@qrder/customer
    startCommand: pnpm --filter @qrder/customer exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://qrder-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://qrder-api.onrender.com

  # ---------------------------------------------------------------- admin
  - type: web
    name: qrder-admin
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@qrder/admin
    startCommand: pnpm --filter @qrder/admin exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://qrder-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://qrder-api.onrender.com

  # -------------------------------------------------------------- kitchen
  - type: web
    name: qrder-kitchen
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@qrder/kitchen
    startCommand: pnpm --filter @qrder/kitchen exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://qrder-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://qrder-api.onrender.com

  # ------------------------------------------------------------------ pos
  - type: web
    name: qrder-pos
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@qrder/pos
    startCommand: pnpm --filter @qrder/pos exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://qrder-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://qrder-api.onrender.com
